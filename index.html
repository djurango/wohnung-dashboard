<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wohnungs-Radar Zürich</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e4e2da;
    --accent: #c8102e; --match: #1f7a4d; --near: #c77700; --radar: #6b3fa0; --neubau: #1d5fa8;
    --chip: #efede6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #33322e;
      --accent: #ff4d63; --match: #3fbf7f; --near: #f0a030; --radar: #a77be0; --neubau: #5b9be8; --chip: #2a2a27;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9a92; --line: #33322e;
    --accent: #ff4d63; --match: #3fbf7f; --near: #f0a030; --radar: #a77be0; --neubau: #5b9be8; --chip: #2a2a27;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 16px 20px 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 20px 12px; }
  nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
               padding: 6px 12px; font: inherit; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  nav .n { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(340px, 480px) 1fr; gap: 12px; padding: 0 20px 20px;
         height: calc(100vh - 110px); }
  #list { overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  #map { border-radius: 12px; border: 1px solid var(--line); min-height: 320px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
          display: grid; grid-template-columns: 84px 1fr; gap: 12px; border-left: 4px solid var(--kind, var(--line)); }
  .card.noimg { grid-template-columns: 1fr; }
  .card img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; background: var(--chip); }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .price { font-weight: 650; font-size: 15px; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .title { margin: 2px 0 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; margin-left: 6px; }
  .warn { color: var(--near); font-size: 12.5px; }
  select, .btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel);
                 color: var(--ink); border-radius: 8px; padding: 4px 8px; cursor: pointer; text-decoration: none; }
  .btn:hover, select:hover { border-color: var(--ink); }
  .empty { color: var(--muted); padding: 24px; text-align: center; background: var(--panel);
           border: 1px dashed var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  td, th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 2px; }
  td a:hover { text-decoration-color: var(--accent); }
  .ok { color: var(--match); } .bad { color: var(--accent); }
  .block { display: block; }
  .leaflet-popup-content { font: 13px/1.4 system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .basemap { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  }
  :root[data-theme="dark"] .basemap { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  @media (max-width: 820px) {
    header, nav { padding-left: 16px; padding-right: 16px; }
    main { grid-template-columns: 1fr; height: auto; padding: 0 16px 16px; }
    #map { height: 320px; order: -1; }
    #list { overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <h1>Wohnungs-Radar <span>Zürich</span></h1>
  <div class="sub" id="sub">lädt …</div>
</header>
<nav id="tabs"></nav>
<main>
  <section id="list" aria-live="polite"></section>
  <div id="map" role="region" aria-label="Karte"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const STATUSES = ["neu", "interessant", "beworben", "Besichtigung", "Zusage", "abgesagt", "verworfen"];
const TABS = [
  ["match", "Treffer"], ["near", "Knapp daneben"], ["radar", "Genossenschaft/Neubau-Ads"],
  ["applied", "Meine Pipeline"], ["neubau", "Neubau-Projekte"], ["watch", "Genossenschaften"], ["sources", "Quellen"],
];
const KIND_COLOR = {match: "--match", near: "--near", radar: "--radar"};
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const chf = (v) => v == null ? "CHF ?" : "CHF " + Number(v).toLocaleString("de-CH");
const safeUrl = (u) => /^https?:\/\//i.test(String(u || "")) ? String(u) : null;  // data comes from scraped pages
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `vor ${m} min` : m < 1440 ? `vor ${Math.round(m / 60)} h` : `vor ${Math.round(m / 1440)} T`;
};

/** Tiny DOM builder: h("a", {href, class}, "text", child, …). Strings become text nodes. */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function popup(...lines) { return h("div", {}, ...lines.map((l) => l instanceof Node ? l : h("div", {}, l))); }

let offline = false;
async function getJSON(url, fallback) {
  try { const r = await fetch(url, {cache: "no-store"}); return r.ok ? await r.json() : fallback; }
  catch { offline = true; return fallback; }  // server not running
}

let D = {listings: [], status: {}, watch: {}, neubau: {}, coops: {}, tracker: {}}, tab = "match", map, layer;
try { tab = localStorage.getItem("tab") || "match"; } catch {}

// Status marks (beworben, Besichtigung …): saved by the local server when it runs, otherwise
// (published static page) only in this browser — they are never published.
let serverTracker = false;
async function loadTracker() {
  try {
    const r = await fetch("api/tracker", {cache: "no-store"});
    if (r.ok) { serverTracker = true; return await r.json(); }
  } catch { offline = true; }
  try { return JSON.parse(localStorage.getItem("tracker") || "{}"); } catch { return {}; }
}

async function load() {
  offline = false;
  // relative paths: works on the local server and on the published static page
  const [listings, status, watch, neubau, area, tracker, coops] = await Promise.all([
    getJSON("data/listings.json", []), getJSON("data/status.json", {}), getJSON("data/watch.json", {}),
    getJSON("data/neubau.json", {}), getJSON("config/area.geojson", null), loadTracker(), getJSON("data/coops.json", {}),
  ]);
  const local = ["localhost", "127.0.0.1"].includes(location.hostname);
  if (offline && (local || !listings.length)) {
    document.getElementById("sub").textContent = "";
    document.getElementById("list").replaceChildren(h("div", {class: "empty"},
      h("b", {}, local ? "Dashboard-Server läuft nicht." : "Daten konnten nicht geladen werden."),
      h("span", {class: "block"}, local
        ? "Doppelklick auf «Dashboard starten.cmd» im Projektordner (Fenster offen lassen), dann diese Seite neu laden."
        : "Verbindung prüfen und Seite neu laden.")));
    return;
  }
  D = {listings, status, watch, neubau, area, tracker, coops};
  const last = Object.values(status).map((s) => s.at).sort().pop();
  document.getElementById("sub").textContent =
    `${listings.filter((l) => l.kind === "match").length} Treffer · ${Object.keys(neubau).length} Neubau-Projekte · letzter Lauf ${ago(last) || "–"}`;
  initMap();
  render();
}

function initMap() {
  if (map) return;
  map = L.map("map").setView([47.371, 8.505], 13);
  // swisstopo grey national map: free, no key
  L.tileLayer("https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-grau/default/current/3857/{z}/{x}/{y}.jpeg", {
    maxZoom: 19, attribution: "© swisstopo", className: "basemap",
  }).addTo(map);
  if (D.area) {
    const poly = L.geoJSON(D.area, {style: {color: css("--accent"), weight: 2, fillOpacity: 0.05}}).addTo(map);
    map.fitBounds(poly.getBounds(), {padding: [10, 10]});
  }
  layer = L.layerGroup().addTo(map);
}

const statusOf = (uid) => (D.tracker[uid] || {}).status || "neu";

async function setStatus(uid, status) {
  D.tracker[uid] = {...(D.tracker[uid] || {}), status};
  if (serverTracker) await fetch("api/tracker", {method: "POST", body: JSON.stringify({uid, status})});
  else try { localStorage.setItem("tracker", JSON.stringify(D.tracker)); } catch {}
  render();
}

function copyCmd(url) {
  const cmd = `/bewerbung ${url}`;
  navigator.clipboard?.writeText(cmd);
  alert(`In Claude Code einfügen:\n\n${cmd}`);
}

function card(l) {
  const url = safeUrl(l.url), img = safeUrl(l.image);
  const select = h("select", {"aria-label": "Status", onchange: (e) => setStatus(l.uid, e.target.value)},
    STATUSES.map((s) => h("option", {selected: s === statusOf(l.uid) ? "" : null}, s)));
  return h("article", {class: `card ${img ? "" : "noimg"}`, style: `--kind: var(${KIND_COLOR[l.kind] || "--line"})`},
    img && h("img", {src: img, alt: "", loading: "lazy"}),
    h("div", {},
      h("div", {class: "top"},
        h("span", {class: "price"}, `${l.rooms ?? "?"} Zi · ${chf(l.rent_gross || l.rent_net)}`),
        h("span", {class: "meta"}, ago(l.found_at))),
      h("div", {class: "title"}, l.title || ""),
      h("div", {class: "meta"}, [l.street, l.zip, l.source, l.moving_date && `ab ${l.moving_date}`].filter(Boolean).join(" · ")),
      h("div", {class: "row"},
        url && h("a", {class: "btn", href: url, target: "_blank", rel: "noopener"}, "Inserat ↗"),
        url && h("button", {class: "btn", onclick: () => copyCmd(url)}, "Bewerbung entwerfen"),
        select,
        l.reasons?.length ? h("span", {class: "warn"}, `⚠ ${l.reasons.join(", ")}`) : null)));
}

function table(headers, rows) {
  return h("table", {}, h("thead", {}, h("tr", {}, headers.map((x) => h("th", {}, x)))),
    h("tbody", {}, rows.map((cells) => h("tr", {}, cells.map((c) => h("td", {}, c))))));
}

function render() {
  const all = D.listings;
  const pipeline = all.filter((l) => !["neu", "verworfen"].includes(statusOf(l.uid)));
  const counts = {
    match: all.filter((l) => l.kind === "match").length, near: all.filter((l) => l.kind === "near").length,
    radar: all.filter((l) => l.kind === "radar").length, applied: pipeline.length,
    neubau: Object.keys(D.neubau).length, watch: Object.keys(D.coops).length || Object.keys(D.watch).length, sources: Object.keys(D.status).length,
  };
  document.getElementById("tabs").replaceChildren(...TABS.map(([k, label]) =>
    h("button", {"aria-pressed": String(k === tab), onclick: () => { tab = k; try { localStorage.setItem("tab", k); } catch {} render(); }},
      label, h("span", {class: "n"}, counts[k]))));

  const list = document.getElementById("list");
  layer.clearLayers();
  let content;
  if (["match", "near", "radar", "applied"].includes(tab)) {
    const rows = tab === "applied" ? pipeline : all.filter((l) => l.kind === tab && statusOf(l.uid) !== "verworfen");
    content = rows.length ? rows.map(card) : [h("div", {class: "empty"}, "Noch nichts hier – der Radar läuft alle 5 Minuten.")];
    rows.filter((l) => l.lat && l.lon).forEach((l) => {
      const url = safeUrl(l.url);
      L.circleMarker([l.lat, l.lon], {radius: 8, color: css(KIND_COLOR[l.kind] || "--match"), weight: 2, fillOpacity: .7})
        .bindPopup(popup(h("b", {}, `${l.rooms ?? "?"} Zi · ${chf(l.rent_gross)}`), l.street || "",
          url ? h("a", {href: url, target: "_blank", rel: "noopener"}, "Inserat ↗") : ""))
        .addTo(layer);
    });
  } else if (tab === "neubau") {
    const rank = {"Im Bau": 3, "Bewilligt": 2, "Projektiert": 1};
    const rows = Object.values(D.neubau).sort((a, b) => (rank[b.status] - rank[a.status]) || (b.flats - a.flats));
    content = [table(["Projekt", "Status", "Whg.", "4+ Zi"], rows.map((p) => [
      [h("b", {}, p.street), h("span", {class: "meta block"}, `${p.zip} ${p.quarter}${p.distance_m ? ` · ${p.distance_m} m ausserhalb` : ""}`)],
      [p.status, p.year ? h("span", {class: "meta block"}, `~${p.year}`) : ""],
      p.flats,
      Object.entries(p.rooms).filter(([k]) => +k >= 4).reduce((s, [, v]) => s + v, 0),
    ]))];
    rows.forEach((p) => L.circleMarker([p.lat, p.lon], {radius: Math.min(16, 5 + p.flats / 12), color: css("--neubau"), weight: 2, fillOpacity: .35})
      .bindPopup(popup(h("b", {}, p.street), `${p.status} · ${p.flats} Wohnungen`)).addTo(layer));
  } else if (tab === "watch" && Object.keys(D.coops).length) {
    // daily Genossenschafts-Radar: all coops of the city directory, own area first
    const link = (url, text) => safeUrl(url) ? h("a", {href: safeUrl(url), target: "_blank", rel: "noopener"}, text) : text;
    const rows = Object.entries(D.coops).sort((a, b) => (b[1].in_area - a[1].in_area) || a[1].name.localeCompare(b[1].name));
    content = [table(["Genossenschaft", "Status", "Geprüft"], rows.map(([url, c]) => {
      const offers = Object.values(c.offers || {});
      const status = /JS-Seite/.test(c.status) ? "manuell prüfen (Seite nur im Browser lesbar)" : c.status;
      return [
        [link(url, c.name), c.in_area && h("span", {class: "chip"}, "im Gebiet"),
         h("span", {class: "meta block"}, `Kreis ${(c.kreise || []).join(", ") || "?"}${c.waitlist ? ` · Warteliste: ${c.waitlist}` : ""}`)],
        [h("span", {class: offers.some((o) => o.fits) ? "ok" : /Fehler/.test(status) ? "bad" : ""}, status),
         ...offers.map((o) => h("span", {class: `meta block ${o.fits ? "ok" : ""}`},
           `${o.fits ? "✓ " : ""}${o.rooms ?? "?"} Zi · ${o.rent ? chf(o.rent) : "Preis ?"} · ${o.text.slice(0, 70)}`))],
        h("span", {class: "meta"}, ago(c.checked)),
      ];
    }))];
  } else if (tab === "watch") {
    const rows = Object.entries(D.watch).sort((a, b) => (b[1].area - a[1].area));
    content = [table(["Seite", "Geprüft"], rows.map(([url, w]) => [
      [safeUrl(url) ? h("a", {href: safeUrl(url), target: "_blank", rel: "noopener"}, w.name) : w.name,
       w.area && h("span", {class: "chip"}, "im Gebiet"), w.error && h("span", {class: "bad block"}, w.error)],
      h("span", {class: "meta"}, ago(w.checked)),
    ]))];
  } else {
    content = [table(["Quelle", "Status", "Letzter Lauf"], Object.entries(D.status).map(([k, s]) => [
      k,
      s.ok ? h("span", {class: "ok"}, `ok · ${s.fetched} geholt, ${s.hits} Treffer`)
           : [h("span", {class: "bad"}, s.blocked ? "blockiert" : "Fehler"), h("span", {class: "meta block"}, s.error || "")],
      h("span", {class: "meta"}, ago(s.at)),
    ]))];
  }
  list.replaceChildren(...content);
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
